- name: "HTH | Identities | Files | Stat file"
  ansible.builtin.stat:
    path: "{{ file_path }}"
  register: file_stats

- name: "HTH | Identities | Files | Modify file"
  ansible.builtin.file:
    path: "{{ file_path }}"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "{{ file_mode }}"
    state : "{{ 'absent' if (file_remove is defined and file_remove) else 'file' if (file_stats.stat.exists) else 'touch' }}"
