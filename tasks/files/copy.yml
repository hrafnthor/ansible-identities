- name: "HTH | Identities | Files | Copy over file"
  ansible.builtin.copy:
    src: "{{ file.source }}"
    dest: "{{ file_path }}"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "{{ file_mode }}"
    force: "{{ file_force }}"
    backup: "{{ file_backup }}"
  when:
    - file.remove is undefined or not file.remove
    - file.source is defined
